[build]
target = "{{ rust_target }}"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
{%- if espidfver == "master" or espidfver contains "v6." %}
# `espidf_picolibc`: ESP-IDF v6.0 and later use picolibc by default; remove it if you switch to newlib
rustflags = [ "--cfg",  "espidf_time64", "--cfg", "espidf_picolibc"]
{%- else %}
rustflags = [ "--cfg",  "espidf_time64"]
{%- endif %}

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "{{ mcu }}"
ESP_IDF_VERSION = "{{ espidfver }}"
ESP_IDF_TOOLS_INSTALL_DIR = "{{ installdir }}"

# Uncomment this if you have moved the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
#CARGO_WORKSPACE_DIR = { value = "", relative = true }
